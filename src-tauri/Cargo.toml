[package]
name = "roudamix-app"
default-run = "roudamix-app"
license = "GPL-3.0-only"
version.workspace = true
edition.workspace = true
description = "RoudaMix UI bridge (Tauri 2)"

[features]
protocol-probe = []

[[bin]]
name = "protocol_probe"
path = "src/bin/protocol_probe.rs"
required-features = ["protocol-probe"]

[lib]
name = "roudamix_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "time", "sync", "io-util", "rt", "macros"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
