name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup default 1.97.1
          if ($LASTEXITCODE -ne 0) { throw 'Rust selection failed' }
      # 快取 cargo test（debug profile）的依賴編譯產物。
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-test-v1
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      - name: Restore dependencies
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed (root)' }
          npm --prefix ui ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed (ui)' }
      - name: Build engine
        shell: pwsh
        run: |
          cmake -S engine -B engine/build -A x64
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
          cmake --build engine/build --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'CMake build failed' }
      - name: Run full test suite
        shell: pwsh
        run: ./scripts/test-all.ps1

  # 預熱與正式打包相同的 Release 依賴；無簽章金鑰、不建立 release。
  release-cache:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup default 1.97.1
          if ($LASTEXITCODE -ne 0) { throw 'Rust selection failed' }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        id: release-cache
        with:
          shared-key: windows-release-v1
      # 快取僅存依賴；命中後不必為每次 UI 修改再跑一次預熱編譯。
      - name: Warm release dependencies on cache miss
        if: steps.release-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed (root)' }
          npm --prefix ui ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed (ui)' }
          cmake -S engine -B engine/build -A x64
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
          cmake --build engine/build --config Release --parallel 4 --target roudamix-engine roudamix-worker
          if ($LASTEXITCODE -ne 0) { throw 'CMake build failed' }
          npm run tauri -- build --ci --no-bundle -- --locked
          if ($LASTEXITCODE -ne 0) { throw 'Release dependency warmup failed' }
