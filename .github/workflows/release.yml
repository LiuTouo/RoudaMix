name: Release
run-name: Release ${{ inputs.version || github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本（例如 0.1.0 或 0.2.0-rc.1，不含 v）'
        required: true
        type: string
      draft:
        description: '保留為草稿，先檢查下載檔案'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate release version and target
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = if ($env:GITHUB_EVENT_NAME -eq 'push') { $env:GITHUB_REF_NAME.Substring(1) } else { $env:REQUESTED_VERSION }
          python scripts/release.py prepare --version $version
          if ($LASTEXITCODE -ne 0) { throw 'Invalid version' }
          $meta = Get-Content target/release-meta/build.json -Raw | ConvertFrom-Json
          $existing = gh api "repos/$env:GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == `"$($meta.tag)`") | .id"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect existing releases' }
          if ($existing) { throw 'Release already exists; choose a new version instead of overwriting it.' }
          $tagCommit = git rev-parse --verify "refs/tags/$($meta.tag)^{commit}" 2>$null
          if ($LASTEXITCODE -eq 0 -and $tagCommit -ne $meta.commit) { throw 'Existing tag points to a different commit' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$($meta.tag)" >> $env:GITHUB_OUTPUT
          "commit=$($meta.commit)" >> $env:GITHUB_OUTPUT
          exit 0
      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup default 1.97.1
          if ($LASTEXITCODE -ne 0) { throw 'Rust selection failed' }
      - name: Test and build portable, installer and corresponding source
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/build-release.ps1 -Version $env:RELEASE_VERSION
      - name: Preserve tested release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: |
            output/release/*
            target/release-meta/notes.md
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: assets
      - name: Upload all files before making the release public
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
          KEEP_DRAFT: ${{ inputs.draft || false }}
        run: |
          set -euo pipefail
          cd assets/output/release
          sha256sum --check SHA256SUMS.txt
          for suffix in windows-x64-portable.zip windows-x64-setup.exe source.tar.gz; do
            test -s "RoudaMix-$RELEASE_VERSION-$suffix"
          done
          args=(--draft --target "$RELEASE_COMMIT" --title "RoudaMix $RELEASE_VERSION" --notes-file ../../target/release-meta/notes.md)
          if [[ "$RELEASE_VERSION" == *-* ]]; then args+=(--prerelease); fi
          # Recheck the tag immediately before publication in case it moved during the build.
          tags=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" --jq '.[].ref')
          if grep -Fxq "refs/tags/$RELEASE_TAG" <<< "$tags"; then
            actual=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
            test "$actual" = "$RELEASE_COMMIT"
          fi
          gh release create "$RELEASE_TAG" "${args[@]}" ./*
          if [[ "$KEEP_DRAFT" != true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false
          fi
          echo "Release: https://github.com/$GH_REPO/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
